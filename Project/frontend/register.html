<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Classic script on purpose: sets data-theme before the first paint -->
  <script src="assets/js/core/theme.js"></script>
  <title>Create account · Find Me a Repo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/coding_cat.png">

  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div id="navbar"></div>

  <main class="auth-wrap">
    <div class="auth-card">

      <div class="eyebrow">// Access</div>
      <h1>Create account</h1>
      <p class="auth-card__lead">Post a project or apply to one in a couple of minutes.</p>

      <form id="register-form" class="stack" novalidate>

        <div class="form-error" id="form-error" role="alert" hidden></div>

        <label class="field">
          <span class="field__label">Name <span class="req">*</span></span>
          <input class="input" id="name" name="name" type="text"
                 autocomplete="name" placeholder="Alex Carter" maxlength="50" required
                 aria-describedby="name-error">
          <span class="field__error" id="name-error"></span>
        </label>

        <label class="field">
          <span class="field__label">Email <span class="req">*</span></span>
          <input class="input" id="email" name="email" type="email"
                 autocomplete="email" placeholder="you@mail.com" required
                 aria-describedby="email-error">
          <span class="field__error" id="email-error"></span>
        </label>

        <div class="field">
          <label class="field__label" for="password">Password <span class="req">*</span></label>

          <div class="input-group">
            <input class="input" id="password" name="password" type="password"
                   autocomplete="new-password" placeholder="••••••••" required
                   aria-describedby="password-error pw-rules">

            <!-- The eye icon is added by pieces.js; a plain field still works
                 without JS, so the button stays hidden until it is wired. -->
            <button class="input-group__action" type="button" hidden
                    data-password-toggle="password" aria-controls="password"
                    aria-label="Show password"></button>
          </div>

          <span class="field__error" id="password-error"></span>

          <!-- Live checklist: each rule turns green as it is satisfied.
               It sits outside the <label>, which may only contain phrasing content. -->
          <ul class="pw-rules" id="pw-rules" aria-live="polite">
            <li data-rule="length">8–72 characters</li>
            <li data-rule="lower">one lowercase letter</li>
            <li data-rule="upper">one uppercase letter</li>
            <li data-rule="digit">one number</li>
            <li data-rule="special">one special character</li>
          </ul>
        </div>

        <button class="btn btn--primary btn--lg btn--full" id="submit" type="submit">
          Create account
        </button>

      </form>

      <div class="auth-card__foot">
        Already have an account? <a href="login.html">Sign in</a>
      </div>

    </div>
  </main>

  <div id="footer"></div>

  <script type="module" src="assets/js/pages/auth.js"></script>
</body>
</html>
