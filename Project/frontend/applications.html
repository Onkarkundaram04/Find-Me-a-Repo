<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Classic script on purpose: sets data-theme before the first paint -->
  <script src="assets/js/core/theme.js"></script>
  <title>Applications · Find Me a Repo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/coding_cat.png">

  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div id="navbar"></div>

  <main>
    <div class="container">

      <a class="back-link mono-text xs muted" id="back-link" href="dashboard.html">← Back</a>

      <header class="page-head">
        <div class="page-head__text">
          <div class="eyebrow">// Review</div>
          <h1 id="page-title">Applications</h1>
          <p id="page-lead">People who want to work on this project.</p>
        </div>

        <div class="page-head__actions" id="head-actions"></div>
      </header>

      <!-- Three counters: pending / accepted / rejected -->
      <div class="grid grid--stats" id="summary"></div>

      <div class="toolbar">
        <div class="filter-group" id="status-filters" role="group"
             aria-label="Filter applications by status"></div>
      </div>

      <div class="stack" id="list" aria-live="polite"></div>

    </div>
  </main>

  <div id="footer"></div>

  <script type="module" src="assets/js/pages/applications.js"></script>
</body>
</html>
